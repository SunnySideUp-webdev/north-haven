<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs><style>.canvas{fill:#fbf9f8}.paper{fill:#fffefc}.lav0{fill:#f6f3f8}.lav1{fill:#ece7f1}.lav2{fill:#dcd4e6}.lav3{fill:#c4b8d6}.bl2{fill:#f8e6e6}.bl3{fill:#f0d3d6}.urgent{fill:#f8e0e3}.success{fill:#e6eee7}.waiting{fill:#f4ead7}.ink{fill:#403a44}.muted{fill:#756e79}.ui{font-family:Arial,sans-serif}.display{font-family:Arial,sans-serif;font-weight:700;letter-spacing:-1px}.h1{font-size:36px}.h2{font-size:17px;font-weight:700}.body{font-size:13px}.meta{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.line{stroke:#ddd7df;stroke-width:1}.box{fill:#fffefc;stroke:#ddd7df;stroke-width:1}.button{fill:#c4b8d6;stroke:#82709c;stroke-width:1}.shadow{filter:url(#s)}</style><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#756e79" flood-opacity=".07"/></filter></defs>
  <rect class="canvas" width="1440" height="1024"/><rect class="paper" width="1440" height="72"/><rect class="bl3" width="1440" height="4"/><text class="ink display" font-size="25" x="42" y="46">North Haven</text><text class="muted ui body" x="1232" y="43">Interaction states</text>
  <rect class="lav1" x="0" y="72" width="1440" height="126"/><text class="ink display h1" x="54" y="132">Calm in every state</text><text class="muted ui body" x="55" y="166">Clear feedback without alarms, dead ends, or unnecessary interruption.</text>
  <rect class="paper shadow" x="30" y="226" rx="12" width="430" height="224"/><text class="ink ui h2" x="58" y="264">Nothing planned yet</text><rect class="lav0" x="58" y="286" rx="8" width="374" height="98"/><circle class="lav2" cx="92" cy="324" r="15"/><text class="ink ui body" x="120" y="321">Your day is still open.</text><text class="muted ui meta" x="120" y="344">Choose only what deserves your attention.</text><text fill="#82709c" class="ui body" x="58" y="416">Plan this day</text>
  <rect class="paper shadow" x="505" y="226" rx="12" width="430" height="224"/><text class="ink ui h2" x="533" y="264">Saving quietly</text><rect class="lav0" x="533" y="286" rx="8" width="374" height="98"/><rect class="lav2" x="557" y="308" rx="4" width="230" height="10"/><rect class="lav1" x="557" y="331" rx="4" width="300" height="10"/><rect class="lav1" x="557" y="354" rx="4" width="176" height="10"/><text class="muted ui body" x="533" y="416">Saving changes…</text>
  <rect class="paper shadow" x="980" y="226" rx="12" width="430" height="224"/><text class="ink ui h2" x="1008" y="264">Validation</text><text class="muted ui label" x="1008" y="303">TICKET NUMBER</text><rect x="1008" y="317" rx="8" width="374" height="44" fill="#fffefc" stroke="#995c67"/><text class="ink ui body" x="1028" y="345">1909</text><text fill="#995c67" class="ui meta" x="1008" y="385">Enter the number exactly as it appears in the ticket system.</text><text class="muted ui meta" x="1008" y="416">Your other changes are still here.</text>
  <rect class="paper shadow" x="30" y="478" rx="12" width="430" height="224"/><text class="ink ui h2" x="58" y="516">Possible duplicate</text><rect class="waiting" x="58" y="538" rx="8" width="374" height="105"/><text fill="#735d35" class="ui body" x="80" y="570" font-weight="700">Ticket #1909 already exists</text><text fill="#735d35" class="ui meta" x="80" y="594">Update customer address · Active</text><text fill="#735d35" class="ui body" x="80" y="623">Open existing ticket</text><text class="muted ui meta" x="58" y="674">You can still save if the number is intentionally reused.</text>
  <rect class="paper shadow" x="505" y="478" rx="12" width="430" height="224"/><text class="ink ui h2" x="533" y="516">Calendar needs attention</text><rect class="urgent" x="533" y="538" rx="8" width="374" height="105"/><text fill="#8a4350" class="ui body" x="555" y="570" font-weight="700">Calendar has not synced since yesterday</text><text fill="#8a4350" class="ui meta" x="555" y="594">Meetings may be out of date. Planning still works.</text><text fill="#8a4350" class="ui body" x="555" y="623">Reconnect</text><text class="muted ui meta" x="533" y="674">Never blocks manual work.</text>
  <rect class="paper shadow" x="980" y="478" rx="12" width="430" height="224"/><text class="ink ui h2" x="1008" y="516">Out of office</text><rect class="lav1" x="1008" y="538" rx="8" width="374" height="105"/><text fill="#584a6b" class="ui body" x="1030" y="570" font-weight="700">Monday is marked Out of Office</text><text fill="#584a6b" class="ui meta" x="1030" y="594">The next suggested workday is Tuesday, August 11.</text><text fill="#584a6b" class="ui body" x="1030" y="623">Plan urgent work anyway</text><text class="muted ui meta" x="1008" y="674">Requires an explicit choice.</text>
  <rect class="paper shadow" x="30" y="730" rx="12" width="430" height="224"/><text class="ink ui h2" x="58" y="768">Capacity reminder</text><rect class="bl2" x="58" y="790" rx="8" width="374" height="105"/><text fill="#995c67" class="ui body" x="80" y="822" font-weight="700">Tomorrow already has 9 actionable items</text><text fill="#995c67" class="ui meta" x="80" y="846">A smaller plan may feel more manageable.</text><text fill="#995c67" class="ui body" x="80" y="875">Review the plan</text><text class="muted ui meta" x="58" y="926">The reminder never prevents adding work.</text>
  <rect class="paper shadow" x="505" y="730" rx="12" width="430" height="224"/><text class="ink ui h2" x="533" y="768">Confirm a meaningful change</text><rect class="lav0" x="533" y="790" rx="8" width="374" height="105"/><text class="ink ui body" x="555" y="822" font-weight="700">Close ticket #1812?</text><text class="muted ui meta" x="555" y="846">This confirms all downstream work is complete.</text><text class="muted ui body" x="555" y="875">Cancel</text><rect class="button" x="748" y="857" rx="7" width="132" height="30"/><text fill="#584a6b" class="ui meta" x="814" y="877" text-anchor="middle" font-weight="700">Close ticket</text><text class="muted ui meta" x="533" y="926">Use confirmation only when state meaning changes.</text>
  <rect class="paper shadow" x="980" y="730" rx="12" width="430" height="224"/><text class="ink ui h2" x="1008" y="768">Connection unavailable</text><rect class="lav0" x="1008" y="790" rx="8" width="374" height="105"/><text class="ink ui body" x="1030" y="822" font-weight="700">Continue without Google Calendar</text><text class="muted ui meta" x="1030" y="846">Add meetings manually and connect later in Settings.</text><text fill="#82709c" class="ui body" x="1030" y="875">Add a meeting</text><text class="muted ui meta" x="1008" y="926">Always provides a useful next action.</text>
</svg>
