<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs><style>.canvas{fill:#fbf9f8}.paper{fill:#fffefc}.lav0{fill:#f6f3f8}.lav1{fill:#ece7f1}.lav2{fill:#dcd4e6}.lav3{fill:#c4b8d6}.bl2{fill:#f8e6e6}.bl3{fill:#f0d3d6}.ink{fill:#403a44}.muted{fill:#756e79}.ui{font-family:Arial,sans-serif}.display{font-family:Arial,sans-serif;font-style:normal;font-weight:700;letter-spacing:-1px}.h1{font-size:42px}.h2{font-size:18px;font-weight:700}.body{font-size:13px}.meta{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.nav{font-size:14px;font-weight:700}.line{stroke:#ddd7df;stroke-width:1}.box{fill:#fffefc;stroke:#ddd7df;stroke-width:1}.button{fill:#c4b8d6;stroke:#82709c;stroke-width:1}.shadow{filter:url(#s)}</style><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#756e79" flood-opacity=".08"/></filter></defs>
  <rect class="canvas" width="1440" height="1024"/><rect class="paper" width="1440" height="72"/><rect class="bl3" width="1440" height="4"/><text class="ink display" font-size="25" x="42" y="46">North Haven</text><text fill="#82709c" class="ui body" x="1280" y="44">Save and exit</text><line class="line" x1="0" y1="72" x2="1440" y2="72"/>
  <rect class="lav1" x="0" y="72" width="1440" height="144"/><line x1="0" y1="216" x2="1440" y2="216" stroke="#f0d3d6" stroke-width="2"/><text class="ink display h1" x="720" y="139" text-anchor="middle">End of Day</text><text class="muted ui body" x="720" y="174" text-anchor="middle">Tuesday, August 4 · Saved just now</text>
  <line x1="280" y1="270" x2="1160" y2="270" stroke="#dcd4e6" stroke-width="2"/><circle class="bl3" cx="280" cy="270" r="23"/><text class="ink ui nav" x="280" y="275" text-anchor="middle">1</text><text class="ink ui meta" x="280" y="309" text-anchor="middle" font-weight="700">Update Tickets</text><circle class="paper" cx="573" cy="270" r="23" stroke="#dcd4e6"/><text class="muted ui nav" x="573" y="275" text-anchor="middle">2</text><text class="muted ui meta" x="573" y="309" text-anchor="middle">Close Today</text><circle class="paper" cx="866" cy="270" r="23" stroke="#dcd4e6"/><text class="muted ui nav" x="866" y="275" text-anchor="middle">3</text><text class="muted ui meta" x="866" y="309" text-anchor="middle">Review Follow-ups</text><circle class="paper" cx="1160" cy="270" r="23" stroke="#dcd4e6"/><text class="muted ui nav" x="1160" y="275" text-anchor="middle">4</text><text class="muted ui meta" x="1160" y="309" text-anchor="middle">Plan Next Workday</text>
  <rect class="paper shadow" x="92" y="352" rx="12" width="1256" height="580"/><text class="ink ui h2" x="134" y="401">Add tickets received today</text><text class="muted ui body" x="134" y="431">Use Tab to move across fields. Save and add another keeps the form ready.</text>
  <text class="muted ui label" x="134" y="483">TICKET NUMBER *</text><text class="muted ui label" x="420" y="483">TITLE *</text><text class="muted ui label" x="830" y="483">TYPE *</text><text class="muted ui label" x="1050" y="483">PRIORITY</text><rect class="box" x="134" y="495" rx="8" width="250" height="46"/><text class="muted ui body" x="151" y="524">e.g. 1909</text><rect class="box" x="420" y="495" rx="8" width="375" height="46"/><text class="muted ui body" x="437" y="524">Describe the requested change</text><rect class="box" x="830" y="495" rx="8" width="185" height="46"/><text class="muted ui body" x="847" y="524">Select type</text><rect class="lav0" x="1050" y="495" rx="8" width="185" height="46" stroke="#ddd7df"/><text class="ink ui body" x="1067" y="524">Medium</text>
  <text class="muted ui label" x="134" y="588">RECEIVED DATE *</text><text class="muted ui label" x="420" y="588">STATUS</text><text class="muted ui label" x="680" y="588">EXTERNAL LINK</text><rect class="box" x="134" y="600" rx="8" width="250" height="46"/><text class="ink ui body" x="151" y="629">Today</text><rect class="box" x="420" y="600" rx="8" width="225" height="46"/><text class="ink ui body" x="437" y="629">Pending</text><rect class="box" x="680" y="600" rx="8" width="555" height="46"/><text class="muted ui body" x="697" y="629">https://...</text>
  <rect class="paper" x="134" y="687" rx="4" width="22" height="22" stroke="#c4b8d6"/><text class="ink ui body" x="172" y="704">Form backup completed</text><text fill="#82709c" class="ui body" x="420" y="704">+ Add a note</text>
  <rect class="paper" x="720" y="758" rx="8" width="245" height="50" stroke="#c4b8d6"/><text class="ink ui nav" x="842" y="789" text-anchor="middle">Save and add another</text><rect class="paper" x="980" y="758" rx="8" width="255" height="50" stroke="#c4b8d6"/><text class="ink ui nav" x="1107" y="789" text-anchor="middle">Save and add to Friday</text><line class="line" x1="134" y1="842" x2="1235" y2="842"/><text class="muted ui body" x="134" y="881">2 tickets added today</text><rect class="button" x="1090" y="854" rx="8" width="145" height="50"/><text fill="#584a6b" class="ui nav" x="1162" y="885" text-anchor="middle">Continue</text>
</svg>
