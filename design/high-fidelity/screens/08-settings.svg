<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs><style>.canvas{fill:#fbf9f8}.paper{fill:#fffefc}.lav0{fill:#f6f3f8}.lav1{fill:#ece7f1}.lav2{fill:#dcd4e6}.lav3{fill:#c4b8d6}.bl2{fill:#f8e6e6}.bl3{fill:#f0d3d6}.success{fill:#e6eee7}.ink{fill:#403a44}.muted{fill:#756e79}.ui{font-family:Arial,sans-serif}.display{font-family:Arial,sans-serif;font-weight:700;letter-spacing:-1px}.h1{font-size:40px}.h2{font-size:18px;font-weight:700}.body{font-size:13px}.meta{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.nav{font-size:14px;font-weight:700}.line{stroke:#ddd7df;stroke-width:1}.box{fill:#fffefc;stroke:#ddd7df;stroke-width:1}.button{fill:#c4b8d6;stroke:#82709c;stroke-width:1}.shadow{filter:url(#s)}</style><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#756e79" flood-opacity=".07"/></filter></defs>
  <rect class="canvas" width="1440" height="1024"/><rect class="paper" width="1440" height="72"/><rect class="bl3" width="1440" height="4"/><line class="line" x1="0" y1="72" x2="1440" y2="72"/><text class="ink display" font-size="25" x="42" y="46">North Haven</text><text class="muted ui nav" x="250" y="44">Today</text><text class="muted ui nav" x="335" y="44">Plan</text><text class="muted ui nav" x="410" y="44">Work</text><text class="muted ui nav" x="490" y="44">Calendar</text><text class="muted ui nav" x="590" y="44">Insights</text><text class="ink ui nav" x="1310" y="44">Settings</text><rect class="lav3" x="1305" y="65" rx="2" width="69" height="4"/>
  <rect class="lav1" x="0" y="72" width="1440" height="142"/><line x1="0" y1="214" x2="1440" y2="214" stroke="#f0d3d6" stroke-width="2"/><text class="ink display h1" x="54" y="135">Settings</text><text class="muted ui body" x="55" y="174">Keep the planner aligned with your workday.</text>
  <rect class="paper shadow" x="30" y="242" rx="12" width="1380" height="742"/>
  <rect class="lav0" x="60" y="272" rx="10" width="260" height="680"/><rect class="lav2" x="78" y="296" rx="8" width="224" height="44"/><text class="ink ui body" x="98" y="323" font-weight="700">General</text><text class="muted ui body" x="98" y="374">Google Calendar</text><text class="muted ui body" x="98" y="426">Privacy &amp; data</text><text class="muted ui body" x="98" y="478">Account</text>
  <text class="ink ui h2" x="370" y="310">Work schedule</text><text class="muted ui body" x="370" y="337">Used to find your next workday and shape daily planning.</text>
  <text class="muted ui label" x="370" y="382">WORKING DAYS</text><rect class="lav2" x="370" y="400" rx="8" width="58" height="38"/><text class="ink ui meta" x="399" y="424" text-anchor="middle" font-weight="700">Mon</text><rect class="lav2" x="438" y="400" rx="8" width="58" height="38"/><text class="ink ui meta" x="467" y="424" text-anchor="middle" font-weight="700">Tue</text><rect class="lav2" x="506" y="400" rx="8" width="58" height="38"/><text class="ink ui meta" x="535" y="424" text-anchor="middle" font-weight="700">Wed</text><rect class="lav2" x="574" y="400" rx="8" width="58" height="38"/><text class="ink ui meta" x="603" y="424" text-anchor="middle" font-weight="700">Thu</text><rect class="lav2" x="642" y="400" rx="8" width="58" height="38"/><text class="ink ui meta" x="671" y="424" text-anchor="middle" font-weight="700">Fri</text><rect class="box" x="710" y="400" rx="8" width="58" height="38"/><text class="muted ui meta" x="739" y="424" text-anchor="middle">Sat</text><rect class="box" x="778" y="400" rx="8" width="58" height="38"/><text class="muted ui meta" x="807" y="424" text-anchor="middle">Sun</text>
  <text class="muted ui label" x="370" y="486">WORKDAY</text><rect class="box" x="370" y="504" rx="8" width="210" height="46"/><text class="ink ui body" x="390" y="533">8:00 AM</text><text class="muted ui body" x="552" y="533">⌄</text><text class="muted ui body" x="596" y="533">to</text><rect class="box" x="630" y="504" rx="8" width="210" height="46"/><text class="ink ui body" x="650" y="533">5:00 PM</text><text class="muted ui body" x="812" y="533">⌄</text>
  <text class="muted ui label" x="370" y="598">TIME ZONE</text><rect class="box" x="370" y="616" rx="8" width="470" height="46"/><text class="ink ui body" x="390" y="645">America/Guatemala (UTC−06:00)</text><text class="muted ui body" x="812" y="645">⌄</text>
  <line class="line" x1="370" y1="704" x2="1345" y2="704"/>
  <text class="ink ui h2" x="370" y="750">Planning preferences</text><text class="muted ui body" x="370" y="777">Gentle guidance only. North Haven never moves work automatically.</text><text class="muted ui body" x="370" y="829">Show a capacity reminder at</text><rect class="box" x="570" y="800" rx="8" width="94" height="44"/><text class="ink ui body" x="590" y="827">9 items</text><text class="muted ui body" x="640" y="827">⌄</text><text class="muted ui body" x="370" y="882">Include suggestions in this order</text><text class="ink ui body" x="620" y="882">Urgent · Follow-ups due · Oldest active</text>
  <rect class="button" x="1194" y="890" rx="8" width="150" height="46"/><text fill="#584a6b" class="ui nav" x="1269" y="919" text-anchor="middle">Save changes</text>
  <rect class="success" x="920" y="296" rx="10" width="424" height="158"/><circle cx="958" cy="337" r="15" fill="#fffefc"/><text fill="#47604d" class="ui nav" x="987" y="341">Google Calendar connected</text><text fill="#47604d" class="ui body" x="944" y="377">work.account@company.com</text><text fill="#47604d" class="ui meta" x="944" y="404">Read-only · synced 4 minutes ago</text><text fill="#47604d" class="ui body" x="944" y="432">Manage connection</text>
</svg>
