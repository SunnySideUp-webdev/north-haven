<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <defs><style>
    .canvas{fill:#fbf9f8}.paper{fill:#fffefc}.ink{fill:#403a44}.muted{fill:#756e79}.quiet{fill:#96909a}.border{stroke:#ddd7df;stroke-width:1;fill:none}.display{font-family:Arial,sans-serif;font-style:normal;font-weight:700;letter-spacing:-1.2px}.ui{font-family:Arial,sans-serif}.h1{font-size:46px}.h2{font-size:22px;font-weight:700}.body{font-size:15px}.small{font-size:12px;font-weight:700;letter-spacing:1px}.lav1{fill:#f6f3f8}.lav2{fill:#ece7f1}.lav3{fill:#dcd4e6}.lav4{fill:#c4b8d6}.lav5{fill:#82709c}.lav7{fill:#584a6b}.bl1{fill:#fff7f6}.bl2{fill:#f8e6e6}.bl3{fill:#f0d3d6}.bl4{fill:#e4b6bd}.bl6{fill:#995c67}.success{fill:#e6eee7}.wait{fill:#f4ead7}.urgent{fill:#f8e0e3}.button{fill:#c4b8d6;stroke:#82709c;stroke-width:1}.shadow{filter:url(#shadow)}
  </style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6e6575" flood-opacity="0.12"/></filter></defs>
  <rect class="canvas" width="1440" height="1100"/>
  <rect class="lav2" x="0" y="0" width="1440" height="175"/>
  <text class="ink display h1" x="70" y="88">North Haven</text><text class="muted ui body" x="70" y="125">A calm visual system for deliberate workdays</text>
  <text class="muted ui small" x="1190" y="92">VISUAL SYSTEM · V1</text>

  <text class="ink ui h2" x="70" y="235">Foundation palette</text>
  <g transform="translate(70 270)">
    <rect class="paper" x="0" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="18" y="75">PAPER</text><text class="muted ui body" x="18" y="96">#FFFEFC</text>
    <rect class="lav1" x="170" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="188" y="75">LAVENDER 50</text><text class="muted ui body" x="188" y="96">#F6F3F8</text>
    <rect class="lav2" x="340" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="358" y="75">LAVENDER 100</text><text class="muted ui body" x="358" y="96">#ECE7F1</text>
    <rect class="lav3" x="510" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="528" y="75">LAVENDER 200</text><text class="muted ui body" x="528" y="96">#DCD4E6</text>
    <rect class="lav4" x="680" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="698" y="75">LAVENDER 300</text><text class="muted ui body" x="698" y="96">#C4B8D6</text>
    <rect class="bl2" x="850" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="868" y="75">BLUSH 100</text><text class="muted ui body" x="868" y="96">#F8E6E6</text>
    <rect class="bl3" x="1020" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="1038" y="75">BLUSH 200</text><text class="muted ui body" x="1038" y="96">#F0D3D6</text>
    <rect class="bl4" x="1190" y="0" rx="12" width="150" height="105"/><text class="ink ui small" x="1208" y="75">BLUSH 300</text><text class="muted ui body" x="1208" y="96">#E4B6BD</text>
  </g>

  <text class="ink ui h2" x="70" y="440">Typography</text>
  <rect class="paper border" x="70" y="470" rx="12" width="620" height="210"/>
  <text class="ink display h1" x="105" y="545">A prepared workday</text><text class="muted ui body" x="105" y="580">Display · DM Sans Bold · 46 px</text><text class="ink ui h2" x="105" y="630">Ticket details stay clear and readable</text><text class="muted ui body" x="105" y="657">Interface · DM Sans · 15–18 px</text>

  <text class="ink ui h2" x="735" y="440">Semantic surfaces</text>
  <rect class="success" x="735" y="470" rx="10" width="185" height="85"/><text class="ink ui small" x="755" y="503">COMPLETED</text><text fill="#47604d" class="ui body" x="755" y="532">Done</text>
  <rect class="wait" x="940" y="470" rx="10" width="185" height="85"/><text class="ink ui small" x="960" y="503">WAITING</text><text fill="#735d35" class="ui body" x="960" y="532">Review Friday</text>
  <rect class="urgent" x="1145" y="470" rx="10" width="185" height="85"/><text class="ink ui small" x="1165" y="503">URGENT</text><text fill="#8a4350" class="ui body" x="1165" y="532">Work first</text>
  <rect class="lav2" x="735" y="575" rx="10" width="595" height="105"/><text class="ink ui small" x="760" y="610">PRINCIPLE</text><text class="ink ui body" x="760" y="643">Pastel surfaces organize the page. Dark text carries the meaning.</text>

  <text class="ink ui h2" x="70" y="745">Core controls</text>
  <rect class="button" x="70" y="785" rx="8" width="190" height="48"/><text class="lav7 ui body" x="165" y="815" text-anchor="middle" font-weight="700">Mark ready</text>
  <rect class="paper border" x="280" y="785" rx="8" width="190" height="48"/><text class="ink ui body" x="375" y="815" text-anchor="middle" font-weight="700">Save and exit</text>
  <rect class="paper border" x="500" y="775" rx="8" width="360" height="58"/><text class="muted ui small" x="518" y="794">TICKET NUMBER</text><text class="ink ui body" x="518" y="820">#1909</text>
  <rect class="urgent" x="900" y="792" rx="13" width="88" height="28"/><text fill="#8a4350" class="ui small" x="944" y="811" text-anchor="middle">URGENT</text>
  <rect class="lav2" x="1005" y="792" rx="13" width="98" height="28"/><text class="lav7 ui small" x="1054" y="811" text-anchor="middle">WATCHING</text>
  <rect class="success" x="1120" y="792" rx="13" width="80" height="28"/><text fill="#47604d" class="ui small" x="1160" y="811" text-anchor="middle">DONE</text>

  <text class="ink ui h2" x="70" y="900">Table pattern</text>
  <rect class="paper shadow" x="70" y="930" rx="12" width="1260" height="125"/>
  <rect class="bl2" x="70" y="930" rx="12" width="1260" height="42"/><rect class="bl2" x="70" y="958" width="1260" height="14"/>
  <text class="ink ui small" x="95" y="957">TICKET</text><text class="ink ui small" x="230" y="957">TITLE</text><text class="ink ui small" x="720" y="957">PRIORITY</text><text class="ink ui small" x="900" y="957">STATUS</text><text class="ink ui small" x="1110" y="957">NEXT REVIEW</text>
  <text class="ink ui body" x="95" y="1015">#1812</text><text class="ink ui body" x="230" y="1015">Confirm downstream form changes</text><text class="muted ui body" x="720" y="1015">Medium</text><text class="lav7 ui body" x="900" y="1015">Watching</text><text class="muted ui body" x="1110" y="1015">Friday, Aug 7</text>
</svg>
