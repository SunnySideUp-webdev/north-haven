<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs><style>.canvas{fill:#fbf9f8}.paper{fill:#fffefc}.lav0{fill:#f6f3f8}.lav1{fill:#ece7f1}.lav2{fill:#dcd4e6}.lav3{fill:#c4b8d6}.bl2{fill:#f8e6e6}.bl3{fill:#f0d3d6}.success{fill:#e6eee7}.ink{fill:#403a44}.muted{fill:#756e79}.ui{font-family:Arial,sans-serif}.display{font-family:Arial,sans-serif;font-weight:700;letter-spacing:-1px}.h1{font-size:40px}.h2{font-size:18px;font-weight:700}.body{font-size:13px}.meta{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.nav{font-size:14px;font-weight:700}.line{stroke:#ddd7df;stroke-width:1}.button{fill:#c4b8d6;stroke:#82709c;stroke-width:1}.shadow{filter:url(#s)}</style><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#756e79" flood-opacity=".07"/></filter></defs>
