<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs><style>.bg{fill:#f8f7f5}.paper{fill:#fffefd}.lav{fill:#e3dfeb}.lav2{fill:#f0edf4}.pink{fill:#f2dedf}.ink{fill:#434047;font-family:Arial,sans-serif}.muted{fill:#77737d;font-family:Arial,sans-serif}.line{stroke:#bbb8bf;stroke-width:1.5;fill:none}.h1{font-size:34px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.nav{font-size:14px;font-weight:700}.btn{fill:#cbc2db;stroke:#a9a2b5;stroke-width:1}</style></defs>
  <rect class="bg" width="1440" height="1024"/><rect class="paper" width="1440" height="70"/><line class="line" x1="0" y1="70" x2="1440" y2="70"/><text class="ink h2" x="42" y="43">North Haven</text><text class="muted nav" x="250" y="43">Today</text><text class="muted nav" x="335" y="43">Plan</text><text class="muted nav" x="410" y="43">Work</text><text class="muted nav" x="490" y="43">Calendar</text><text class="muted nav" x="590" y="43">Insights</text><text class="ink nav" x="1310" y="43">Settings</text>
  <rect class="lav" x="0" y="70" width="1440" height="135"/><text class="ink h1" x="55" y="132">Settings</text><text class="muted body" x="55" y="166">Manage your workday, calendar connection, and data.</text>
  <rect class="lav2" x="35" y="235" rx="8" width="270" height="735"/><text class="muted body" x="65" y="285">Profile</text><text class="muted body" x="65" y="335">Work schedule</text><text class="muted body" x="65" y="385">Ticket types</text><rect class="pink" x="50" y="410" rx="6" width="240" height="50"/><text class="ink nav" x="65" y="440">Calendar connection</text><text class="muted body" x="65" y="505">Data and privacy</text><text class="muted body" x="65" y="555">Security</text>
  <rect class="paper" x="335" y="235" rx="8" width="1070" height="735"/><text class="ink h2" x="375" y="285">Google Calendar</text><text class="muted body" x="375" y="317">Meetings and official Out of Office events are synchronized read-only.</text>
  <rect class="lav2" x="375" y="355" rx="7" width="990" height="115"/><text class="ink h2" x="405" y="395">Corporate Google account</text><text class="muted body" x="405" y="425">sunny@company.com · Connected</text><text class="muted small" x="405" y="449">Last synced 4 minutes ago</text><rect class="paper line" x="1120" y="386" rx="6" width="105" height="42"/><text class="ink body" x="1172" y="412" text-anchor="middle">Sync now</text><text class="muted body" x="1250" y="412">Disconnect</text>
  <text class="muted small" x="375" y="520">SELECTED CALENDARS</text>
  <rect class="line" x="380" y="552" width="20" height="20" rx="3"/><rect class="lav" x="380" y="552" width="20" height="20" rx="3"/><text class="ink body" x="420" y="568">Primary work calendar</text><text class="muted small" x="1180" y="568">Meetings · OOO</text>
  <line class="line" x1="375" y1="600" x2="1365" y2="600"/><rect class="line" x="380" y="628" width="20" height="20" rx="3"/><text class="ink body" x="420" y="644">Company holidays</text><text class="muted small" x="1180" y="644">Not selected</text>
  <line class="line" x1="375" y1="682" x2="1365" y2="682"/>
  <text class="ink h2" x="375" y="730">Permissions</text><text class="muted body" x="375" y="765">North Haven can view events on selected calendars.</text><text class="muted body" x="375" y="794">North Haven cannot create, edit, delete, or invite attendees.</text>
  <rect class="pink" x="375" y="840" rx="7" width="990" height="78"/><text class="ink body" x="405" y="873">If your company blocks the connection, ticket planning will continue normally.</text><text class="muted small" x="405" y="897">Calendar synchronization is an enhancement, not a dependency for core work.</text>
  <text class="muted small" x="1395" y="1000" text-anchor="end">08 · SETTINGS · CALENDAR CONNECTION · LOW FIDELITY</text>
</svg>
