<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#f8f7f5}.paper{fill:#fffefd}.lav{fill:#e3dfeb}.pink{fill:#f2dedf}.line{stroke:#aaa7af;stroke-width:2;fill:none}.ink{fill:#434047;font-family:Arial,sans-serif}.muted{fill:#77737d;font-family:Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.num{font-size:18px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d8992"/></marker>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="lav" x="0" y="0" width="1440" height="150"/>
  <text class="ink h1" x="720" y="72" text-anchor="middle">North Haven core experience</text>
  <text class="muted body" x="720" y="105" text-anchor="middle">The inventory stays quiet. A deliberate plan becomes the workday.</text>

  <rect class="paper line" x="55" y="255" rx="12" width="225" height="190"/>
  <circle class="pink" cx="95" cy="295" r="22"/><text class="ink num" x="95" y="302" text-anchor="middle">1</text>
  <text class="ink h2" x="80" y="350">Work inventory</text>
  <text class="muted body" x="80" y="382">Tickets, tasks, reminders</text>
  <text class="muted body" x="80" y="409">and follow-ups exist here.</text>

  <path class="line" d="M280 350 H340" marker-end="url(#arrow)"/>
  <rect class="paper line" x="355" y="230" rx="12" width="260" height="240"/>
  <circle class="pink" cx="395" cy="270" r="22"/><text class="ink num" x="395" y="277" text-anchor="middle">2</text>
  <text class="ink h2" x="380" y="325">End of Day</text>
  <text class="muted body" x="380" y="357">Update tickets</text>
  <text class="muted body" x="380" y="384">Close today's outcomes</text>
  <text class="muted body" x="380" y="411">Review follow-ups</text>
  <text class="muted body" x="380" y="438">Select the next workday</text>

  <path class="line" d="M615 350 H675" marker-end="url(#arrow)"/>
  <rect class="lav line" x="690" y="255" rx="12" width="225" height="190"/>
  <circle class="paper" cx="730" cy="295" r="22"/><text class="ink num" x="730" y="302" text-anchor="middle">3</text>
  <text class="ink h2" x="715" y="350">Plan ready</text>
  <text class="muted body" x="715" y="382">A finite list is prepared.</text>
  <text class="muted body" x="715" y="409">The rest stays out of sight.</text>

  <path class="line" d="M915 350 H975" marker-end="url(#arrow)"/>
  <rect class="paper line" x="990" y="230" rx="12" width="260" height="240"/>
  <circle class="pink" cx="1030" cy="270" r="22"/><text class="ink num" x="1030" y="277" text-anchor="middle">4</text>
  <text class="ink h2" x="1015" y="325">Today</text>
  <text class="muted body" x="1015" y="357">Know what to do next</text>
  <text class="muted body" x="1015" y="384">See meetings in context</text>
  <text class="muted body" x="1015" y="411">Record actual outcomes</text>
  <text class="muted body" x="1015" y="438">Ignore unplanned inventory</text>

  <path class="line" d="M1120 470 V540" marker-end="url(#arrow)"/>
  <rect class="paper line" x="865" y="570" rx="12" width="510" height="145"/>
  <circle class="lav" cx="910" cy="610" r="22"/><text class="ink num" x="910" y="617" text-anchor="middle">5</text>
  <text class="ink h2" x="950" y="617">Calendar history and Insights</text>
  <text class="muted body" x="900" y="660">Actual work creates a calm monthly record and neutral trends.</text>
  <path class="line" d="M865 645 H485 V480" marker-end="url(#arrow)"/>

  <rect class="pink" x="55" y="580" rx="10" width="620" height="135"/>
  <text class="ink h2" x="85" y="620">Rules that protect the experience</text>
  <text class="muted body" x="85" y="655">No automatic rollover  ·  No Kanban  ·  No productivity score</text>
  <text class="muted body" x="85" y="684">Google Calendar is read-only  ·  OOO skips the workday</text>

  <text class="muted small" x="720" y="840" text-anchor="middle">LOW-FIDELITY WIREFRAME · STRUCTURE ONLY</text>
</svg>

