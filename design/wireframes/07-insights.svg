  <defs><style>.bg{fill:#f8f7f5}.paper{fill:#fffefd}.lav{fill:#e3dfeb}.lav2{fill:#f0edf4}.pink{fill:#f2dedf}.ink{fill:#434047;font-family:Arial,sans-serif}.muted{fill:#77737d;font-family:Arial,sans-serif}.line{stroke:#bbb8bf;stroke-width:1.5;fill:none}.chart{stroke:#a89dbb;stroke-width:4;fill:none}.h1{font-size:34px;font-weight:700}.h2{font-size:18px;font-weight:700}.big{font-size:30px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.nav{font-size:14px;font-weight:700}</style></defs>
